# Run the same type check and tests on every platform.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Cache Treehouse 3.1.4 archive
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/treehouse-archives
          key: treehouse-3.1.4-${{ runner.os }}-${{ runner.arch }}

      - name: Install Treehouse 3.1.4 (verified SHA-256)
        run: node .github/scripts/install-treehouse.mjs

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Tests
        run: npm test
