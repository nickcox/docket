# Run the same type check and tests on every platform.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}${{ matrix.shard && format(', shard {0}', matrix.shard) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-latest
          - os: windows-latest
            shard: 1/3
          - os: windows-latest
            shard: 2/3
          - os: windows-latest
            shard: 3/3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Restore Treehouse 3.1.4 archive
        id: restore-treehouse
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/treehouse-archives
          key: treehouse-3.1.4-${{ runner.os }}-${{ runner.arch }}

      - name: Install Treehouse 3.1.4 (verified SHA-256)
        id: install-treehouse
        run: node .github/scripts/install-treehouse.mjs

      - name: Save Treehouse 3.1.4 archive
        if: steps.restore-treehouse.outputs.cache-hit != 'true' && steps.install-treehouse.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/treehouse-archives
          key: treehouse-3.1.4-${{ runner.os }}-${{ runner.arch }}

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Tests
        # Node options must precede the test glob; npm test -- appends them
        # after it, where Node 26 does not apply --test-shard.
        run: node --test ${{ matrix.shard && format('--test-shard={0}', matrix.shard) || '' }} "tests/**/*.test.ts"
